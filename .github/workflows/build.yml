name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Compile Kotlin Code with Android Platform
        run: |
          # العثور على ملف android.jar داخل الـ SDK
          ANDROID_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          echo "Using Android Jar: $ANDROID_JAR"
          
          # تجميع ملف الكوتلن باستعمال مكتبات أندرويد
          kotlinc MainActivity.kt -cp "$ANDROID_JAR" -include-runtime -d AlrafeeqAssistant.jar

      - name: Upload Application
        uses: actions/upload-artifact@v4
        with:
          name: Alrafeeq-App
          path: AlrafeeqAssistant.jar
